<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/forms.css">
    <title>Create Account</title>
</head>
<body>

    <div class="container">
        <div class="logo">Pixel</div>
        <h1>Create Account</h1>
        <p class="sub-title">Please fill in the details in the form</p>

        <form action="">
                <div class="input-group">
                        <label for="fname">First Name</label>
                        <input type="text" id="fname" name="fname" placeholder="Enter your First Name" required> 
                </div>
                <br>


                <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your Email" required> 
                </div>
                    <br>
                <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your Password" required> 
                </div>
                <br>

                <div class="terms">
                    <label for="terms"><a href="">I agree to the Terms and Condition</a></label>
                    <input type="checkbox" id="name" name="terms">
                </div>
                <br>

                <div class="button">
                    <button type="submit">Create Account</button>
                </div>
        </form>
        <p class="login">Already have an account?<a href="#">Login</a></p>
    </div>
    
</body>
</html>
